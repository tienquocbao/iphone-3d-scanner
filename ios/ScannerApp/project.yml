name: ScannerApp

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"

targets:
  ScannerApp:
    type: application
    platform: iOS

    sources:
      - ScannerApp

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.iphone3dscanner
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"

    info:
      path: ScannerApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Camera access is required for 3D scanning."
        NSLocalNetworkUsageDescription: "Local network access is required to transfer scan sessions to your Windows receiver."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  ScannerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ScannerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.iphone3dscanner.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScannerApp.app/ScannerApp"
