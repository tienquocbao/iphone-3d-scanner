<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iPhone 3D Scanner</title>
  <link rel="stylesheet" href="/styles.css?v=2">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "three/addons/": "/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>iPhone 3D Scanner</h1>
    <label>Bearer token <input id="token" type="password" autocomplete="off"></label>
    <button id="connect" type="button">Connect</button>
    <span id="diagnostics" role="status"></span>
  </header>
  <main>
    <section>
      <h2>Verified sessions</h2>
      <p id="dashboard-status" role="status">Loading sessions…</p>
      <table>
        <thead><tr><th>Session</th><th>Frames</th><th>Size</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="sessions"></tbody>
      </table>
    </section>
    <section>
      <h2 id="viewer-title">Viewer</h2>
      <div id="job" role="status"></div>
      <div id="viewer"></div>
    </section>
  </main>
  <script type="module" src="/app.js?v=2"></script>
</body>
</html>
