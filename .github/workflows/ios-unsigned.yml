name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/ScannerApp
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios/ScannerApp
        run: |
          xcodebuild \
            -project ScannerApp.xcodeproj \
            -scheme ScannerApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload

          cp -R \
            build/ios/Build/Products/Debug-iphoneos/ScannerApp.app \
            dist/Payload/

          cd dist
          zip -qry ScannerApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScannerApp-unsigned
          path: dist/ScannerApp-unsigned.ipa
          if-no-files-found: error
